# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket claims a delay / authority the DB row does not hold
stale_policy: FM-06            # cites a superseded or not-yet-effective clause
clause_sum: FM-04              # asks to add the clauses instead of taking the max
double_deduct: FM-05           # order already has a refund: agent must not deduct it before the host
sibling_refund: FM-07          # "gom đơn": refund written under sibling claims of the same order
denied_ignored: FM-02          # host denies (expired approval / order fully refunded); agent must say so
reply_ledger_mismatch: FM-08   # approval caps below the quote: reply must state the ledger amount
cross_principal: FM-09         # requester is not the order's principal (taxonomy row added from the v2 run)
